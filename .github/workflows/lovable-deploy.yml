name: "Build e Deploy para stable-website"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: "Instalar Dependencias"
        run: npm install

      - name: "Rodar Build"
        run: npm run build

      # Copia o worker do PDF.js para um caminho estavel com extensao .js.
      # O worker continua sendo um modulo ES, mas nao depende do nome hash
      # nem do tratamento de .mjs pelo Apache.
      - name: "Preparar worker do PDF.js"
        run: |
          if [ -f node_modules/pdfjs-dist/build/pdf.worker.min.mjs ]; then
            cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs dist/client/pdf.worker.min.js
          elif [ -f node_modules/pdfjs-dist/build/pdf.worker.min.mjs ]; then
            cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs dist/pdf.worker.min.js
          else
            echo "::error::Worker do PDF.js nao encontrado em node_modules/pdfjs-dist/build/"
            exit 1
          fi

      - name: "Localizar shell SPA do TanStack Start"
        id: locate-shell
        run: |
          if [ -f dist/client/_shell.html ]; then
            echo "deploy_dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f dist/_shell.html ]; then
            echo "deploy_dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "::error::_shell.html nao encontrado em dist/ ou dist/client/."
            exit 1
          fi

      # Se o build estiver em dist/, move o worker para a raiz desse deploy.
      - name: "Garantir worker no diretorio de deploy"
        run: |
          if [ "${{ steps.locate-shell.outputs.deploy_dir }}" = "dist" ] && [ -f dist/client/pdf.worker.min.js ]; then
            mv dist/client/pdf.worker.min.js dist/pdf.worker.min.js
          fi

      - name: "Gerar .htaccess para Apache"
        run: |
          cat > "${{ steps.locate-shell.outputs.deploy_dir }}/.htaccess" <<'HTACCESS'
          DirectoryIndex _shell.html

          RewriteEngine On

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ _shell.html [L]

          # PDF.js worker: caminho estavel e MIME JavaScript.
          AddType text/javascript .js
          AddType text/javascript .mjs

          <IfModule mod_headers.c>
            <FilesMatch "_shell\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(?:js|mjs|css|woff2|woff|svg|png|jpg|jpeg|webp|gif|ico)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
          </IfModule>
          HTACCESS

      - name: "Deploy para a Branch stable-website"
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: ${{ steps.locate-shell.outputs.deploy_dir }}
          clean: true
