name: "Build e Deploy para stable-website"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: "Instalar Dependencias"
        run: npm install

      - name: "Rodar Build"
        run: npm run build

      - name: "Localizar shell SPA do TanStack Start"
        id: locate-shell
        shell: bash
        run: |
          if [ -f dist/client/_shell.html ]; then
            echo "deploy_dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f dist/_shell.html ]; then
            echo "deploy_dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "::error::_shell.html nao encontrado em dist/ ou dist/client/."
            find dist -maxdepth 3 -type f | sort | head -200 || true
            exit 1
          fi

      # PDF.js 6 usa um Web Worker ES Module. O deploy e estatico em Apache,
      # portanto colocamos uma copia com caminho fixo diretamente na raiz do
      # diretorio que sera publicado. Nao dependemos de asset hash do Vite.
      - name: "Instalar worker PDF.js no diretorio publicado"
        shell: bash
        run: |
          DEPLOY_DIR="${{ steps.locate-shell.outputs.deploy_dir }}"
          WORKER="node_modules/pdfjs-dist/build/pdf.worker.min.mjs"

          if [ ! -f "$WORKER" ]; then
            echo "::error::Worker do PDF.js nao encontrado: $WORKER"
            find node_modules/pdfjs-dist -maxdepth 3 -type f -iname '*worker*' | sort || true
            exit 1
          fi

          cp "$WORKER" "$DEPLOY_DIR/pdf.worker.min.js"

          if [ ! -s "$DEPLOY_DIR/pdf.worker.min.js" ]; then
            echo "::error::Falha ao copiar pdf.worker.min.js para $DEPLOY_DIR"
            exit 1
          fi

          echo "Worker publicado em: $DEPLOY_DIR/pdf.worker.min.js"
          ls -lh "$DEPLOY_DIR/pdf.worker.min.js"

      - name: "Gerar .htaccess para Apache"
        shell: bash
        run: |
          DEPLOY_DIR="${{ steps.locate-shell.outputs.deploy_dir }}"
          cat > "$DEPLOY_DIR/.htaccess" <<'HTACCESS'
          DirectoryIndex _shell.html

          RewriteEngine On

          # Arquivos existentes, incluindo pdf.worker.min.js, devem ser
          # entregues diretamente e nao cair no fallback da SPA.
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ _shell.html [L]

          # PDF.js worker e JavaScript ES Module.
          AddType text/javascript .js
          AddType text/javascript .mjs

          <IfModule mod_headers.c>
            <FilesMatch "_shell\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(?:js|mjs|css|woff2|woff|svg|png|jpg|jpeg|webp|gif|ico)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
          </IfModule>
          HTACCESS

      - name: "Verificar artefato de deploy"
        shell: bash
        run: |
          DEPLOY_DIR="${{ steps.locate-shell.outputs.deploy_dir }}"
          test -f "$DEPLOY_DIR/_shell.html"
          test -s "$DEPLOY_DIR/pdf.worker.min.js"
          echo "Conteudo do deploy:"
          ls -lah "$DEPLOY_DIR" | head -100

      - name: "Deploy para a Branch stable-website"
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: ${{ steps.locate-shell.outputs.deploy_dir }}
          clean: true
